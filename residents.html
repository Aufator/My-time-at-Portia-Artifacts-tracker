 <div class="nd c" style="left:${cx/W*100}%;top:${cy/H*100}%"><img src="${av(x.id)}" alt=""><b>${x.ru.toUpperCase()}</b></div>
 ${f.map((r,i)=>`<div class="nd" style="left:${pos[i][0]/W*100}%;top:${pos[i][1]/H*100}%;${lk(r[0])?'':'cursor:default'}" ${lk(r[0])?`onclick="location.hash='${r[0]}'"`:''}><img src="${av(r[0])}" alt=""><b>${r[1].toUpperCase()}</b>${r[2]=='fam'?'<small>семья</small>':''}</div>`).join('')}</div>`}
function perks(x){if(!x.perks.length)return '<p>Для этого жителя бонусов нет.</p>';
 return x.perks.map(([lv,n,t])=>{const love=lv>=10,k=love?8:Math.min(10,(lv-4)*2),a=love?'heart':'star';
 return `<div class="pk"><h4>${n}</h4><div class="sr">${Array.from({length:10},(_,i)=>`<img src="ui/i_${a}${i<k?'':'0'}.png" alt="">`).join('')}${love?'<span>+</span><img src="ui/i_ring.png" alt="">':''}</div><p>${t}</p></div>`}).join('')}
function show(){const x=cur,s=SEAS[x.s]||'',T=[['g','Подарки','t_g'],['s','Расписание','t_s'],['r','Связи','t_r'],['b','Бонусы','t_b']];
 const ph=x.pf?`<img class="${x.grp==3?'an':''}" src="img/npc/${x.id}_f.png" alt="">`:(x.ph?`<img class="sq" src="img/npc/${x.id}_h.png" alt="">`:'');
 const body={g:()=>gifts(x),s:()=>sched(x),r:()=>net(x),b:()=>`<h2>Бонусы отношений</h2>`+perks(x)}[tab]();
 $('#app').innerHTML=`<div class="card"><div class="deco back">${(DECO[x.s]||[]).filter(d=>d[2]=='b').map(dimg).join('')}</div><div class="paper"><div class="head"><div class="ph"><div class="in">${ph}</div><img class="tp a" src="ui/tape.png" alt=""><img class="tp b" src="ui/tape.png" alt=""></div><div><h1>${x.ru}</h1><div class="who">${x.who}</div><div class="bio">${x.bio}</div>
 <div class="meta"><div><img src="ui/i_${s||'cal'}.png" alt="">День рождения: ${x.s?String(x.s).padStart(2,'0')+'.'+String(x.d).padStart(2,'0'):'—'}</div>${x.grp==0?`<div><img src="ui/i_mar.png" alt="">Семейное положение: ${x.m}</div>`:''}${x.h?`<div><img src="ui/i_ht.png" alt="">Рост: ${x.h}</div>`:''}${x.w?`<div><img src="ui/i_wt.png" alt="">Вес: ${x.w}</div>`:''}</div></div></div>
 <div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';show()"><img src="ui/i_${t[2]}.png" alt="">${t[1]}</button>`).join('')}</div>
 <div class="panel">${body}</div></div><div class="deco">${(DECO[x.s]||[]).filter(d=>d[2]!='b').map(dimg).join('')}</div></div>`;fx(x.s)}
let grp=0;
function list(){fx(0);$('#app').innerHTML=`<div class="card"><div class="paper list"><h1>Жители Портии</h1><input id="q" placeholder="Поиск жителя…"><div class="chips" id="ch"></div><div class="grid" id="gr"></div></div></div>`;
 const f=()=>{const q=$('#q').value.toLowerCase();$('#ch').innerHTML=GR.map((g,i)=>`<button class="${grp==i&&!q?'on':''}" onclick="grp=${i};f()">${g} · ${D.filter(x=>x.grp==i).length}</button>`).join('');
  $('#gr').innerHTML=D.filter(x=>q?(x.ru+x.en).toLowerCase().includes(q):x.grp==grp).map(x=>{const im=`<img src="${x.ph?`img/npc/${x.id}_h.png`:'ui/i_res.png'}" alt="">${x.ru}`;return x.pg?`<a href="#${x.id}">${im}</a>`:`<div class="np">${im}</div>`}).join('')};window.f=f;$('#q').oninput=f;f()}
function route(){const h=location.hash.slice(1);if(by[h]&&by[h].pg){cur=by[h];tab='g';show();scrollTo(0,0)}else list()}
addEventListener('hashchange',route);route();$('#fxb').onclick=()=>{try{localStorage.setItem('portia-fx',fxOn()?'0':'1')}catch(e){}fx(cur&&location.hash.slice(1)==cur.id?cur.s:0)};let _w=innerWidth;addEventListener('resize',()=>{if(innerWidth!==_w&&Math.abs(innerWidth-_w)>40){_w=innerWidth;if(cur&&by[location.hash.slice(1)])show()}});
</script><script src="ui/auth.js"></script><script src="ui/mobile.js"></script></body></html>
