.b0{background:#fbe1dc}.b0 h3{color:#d9534f}.b0 .pill{background:#ee6a6a}.b1{background:#e2f0d6}.b1 h3{color:#4f9a3c}.b1 .pill{background:#6fb35a}
.b2{background:#f1ecd3}.b2 h3{color:#b59a1f}.b2 .pill{background:#e0c04a}.b3{background:#dcebf7}.b3 h3{color:#2f7fc0}.b3 .pill{background:#4a90d9}.b4{background:#fbe1d8}.b4 h3{color:#d9534f}.b4 .pill{background:#ee7a6a}

.net{position:relative;height:430px;margin:0 auto;max-width:520px}.net svg{position:absolute;inset:0;width:100%;height:100%}
.nd{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer}.nd img{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#b9dde0;border:6px solid #b9dde0;display:block;margin:auto}
.nd.c img{width:108px;height:108px}.nd b{display:block;font:700 17px var(--f);letter-spacing:3px;color:var(--navy);margin-top:4px}.nd small{color:var(--mut);font-weight:600}
.pk{margin:0 0 18px}.pk h4{margin:0 0 4px;font:700 23px var(--h);color:var(--navy)}.sr{display:flex;gap:3px;align-items:center}.sr img{width:34px;height:34px;object-fit:contain}.sr span{font:800 22px var(--f);color:#6aa8d8;margin:0 6px}
.pk p{margin:3px 0 0;font-style:italic;color:#34568f;font-size:14px;text-align:center;width:100%;max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.chips button{border:0;border-radius:12px;padding:7px 12px;background:#f1d6a6;font:800 13px var(--f);color:var(--navy);cursor:pointer}.chips button.on{background:#fff;box-shadow:inset 0 0 0 2px #f0b968}.list h1{margin-bottom:12px}.list input{width:100%;padding:11px 16px;border-radius:14px;border:0;font:600 16px var(--f);margin-bottom:16px;background:#fff8e8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}.grid a{text-align:center;text-decoration:none;color:var(--navy);font-weight:800;font-size:14px;background:rgba(255,255,255,.55);border-radius:14px;padding:10px 4px}
.grid img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#b9dde0;display:block;margin:0 auto 4px}
@media(max-width:900px){body{display:block}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}nav .logo{width:160px;margin:0 10px 0 0}nav a{font-size:14px;height:40px;padding:0 10px}nav .sp,nav a.hide{display:none}main{padding:30px 6px 70px}.head{flex-direction:column;align-items:center}.gg{grid-template-columns:1fr}.panel{margin:0}.tabs{flex-wrap:wrap}.tabs button{flex:1 1 45%}.sd .dn{width:100px}.day{width:100px;padding-left:16px;font-size:12px}}

<script>
const $=s=>document.querySelector(s),by=Object.fromEntries(D.map(x=>[x.id,x]));
const SEAS=['','spring','summer','autumn','winter'],DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
// Декор по сезону рождения: [файл, стиль]. Меняйте позиции/размеры здесь.
const VAR={2:'A',4:'A'};
// [файл, стиль, 'b'=за пергаментом]. Меняйте позиции/размеры здесь.
const DECO={
1:[['p1','left:-34px;top:-36px;width:120px'],['p2','right:-28px;top:-26px;width:150px'],['p3','left:-50px;bottom:-40px;width:260px'],['p4','right:-14px;bottom:-30px;width:130px']],
'2A':[['s1','left:-40px;top:-34px;width:170px'],['s3','right:-26px;top:-24px;width:200px'],['s4','left:-70px;bottom:-84px;width:240px','b'],['s5','right:-70px;bottom:-84px;width:240px','b'],['s6','left:calc(50% - 42px);bottom:-44px;width:84px','b']],
'2B':[['s2','left:-56px;top:-52px;width:230px'],['s1','right:-34px;top:-30px;width:160px'],['s3','right:-44px;bottom:-60px;width:210px'],['s6','left:-18px;bottom:-30px;width:70px']],
'2C':[['s1','left:-40px;top:-34px;width:170px'],['s3','right:-26px;top:-24px;width:190px'],['s4','left:-120px;top:34%;width:200px;transform:rotate(-14deg)','b'],['s5','right:-120px;top:52%;width:200px;transform:rotate(14deg)','b'],['s6','left:calc(50% - 42px);bottom:-44px;width:84px','b']],
3:[['a1','left:-40px;top:-46px;width:210px'],['a2','left:130px;top:-62px;width:200px'],['a4','right:-26px;top:-22px;width:190px'],['a2','left:-40px;bottom:-50px;width:190px'],['a3','right:-30px;bottom:-40px;width:220px']],
'4A':[['w1','left:calc(50% - 200px);top:-62px;width:400px'],['w3','right:-6px;top:-44px;width:110px'],['w2','left:-84px;top:46%;width:120px','b'],['dr','left:-30px;width:calc(100% + 60px);bottom:-62px;height:100px'],['w4','right:-34px;bottom:-34px;width:250px']],
'4B':[['ic','left:6px;width:calc(100% - 12px);top:-6px;height:64px'],['w3','right:-6px;top:-8px;width:104px'],['w2','left:-84px;top:36%;width:120px','b'],['w2','right:-84px;top:62%;width:110px;transform:scaleX(-1)','b'],['dr','left:-30px;width:calc(100% + 60px);bottom:-62px;height:100px']],
0:[]};
const dk=x=>VAR[x.s]?x.s+VAR[x.s]:x.s,SRC={dr:'ui/drift.svg',ic:'ui/icicles.svg'};
const dimg=d=>`<img src="${SRC[d[0]]||'ui/'+d[0]+'.png'}" style="${d[1]}" alt="">`;
function snow(on){document.querySelectorAll('.snow').forEach(e=>e.remove());if(!on||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const w=document.createElement('div');w.className='snow';w.innerHTML=Array.from({length:34},(_,i)=>`<i style="left:${(i*37)%100}%;width:${3+i%4}px;height:${3+i%4}px;animation-duration:${9+i%7*2}s;animation-delay:-${i*1.3}s"></i>`).join('');document.body.appendChild(w)}
const R=[['exc','Любит','heart','b0'],['like','Нравится','happy','b1'],['dis','Не нравится','meh','b2'],['hate','Ненавидит','sad','b3']];
const sg=v=>(v>0?'+':'')+v,img=(f,c)=>f?`<img src="img/item/${f}" alt="" loading="lazy">`:'<i></i>';
const items=l=>l.map(i=>`<div class="it">${img(i[1])}${i[0]}</div>`).join('');
const rows=g=>(g||[]).map(([v,l])=>`<div class="row"><span class="pill">${sg(v)}</span><div class="its">${items(l)}</div></div>`).join('')||'<p class="note">Нет данных</p>';
let cur,tab='g';
function gifts(x){const box=(k)=>{const r=R.find(a=>a[0]==k);return `<div class="box ${r[3]}"><h3><img src="ui/i_${r[2]}.png" alt="">${r[1]}</h3>${rows(x.g[k])}</div>`};
 const w=x.wish.length?`<div class="box b4"><h3><img src="ui/i_star.png" alt="">Желания ${x.ru}</h3><p class="note">Выдаются случайно по одному-двум жителям в неделю, дают больше очков.</p>${x.wish.map(([v,l])=>`<div class="row"><span class="pill">${sg(v)}</span><div class="its">${items(l)}</div></div>`).join('')}</div>`:'';
 return `<div class="gg">${box('exc')}${box('like')}${box('dis')}${box('hate')}${w}</div><p class="note" style="margin-top:10px">Всё остальное даёт +1. В праздники очки удваиваются, в день рождения утраиваются.</p>`}
function sched(x){const s=SCHED[x.id];if(!s)return '<p>Расписание для этого жителя ещё готовится.</p>';
 return s.map((d,i)=>`<div class="sd"><div class="dn"><div class="day" style="background-image:url(ui/day${i}.png)">${DAYS[i]}</div></div><div class="sl">${d.map(r=>`<div class="sr2"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div></div>`).join('')}
function net(x){const f=x.fr;if(!f.length)return '<p>Нет данных о связях.</p>';const n=f.length,W=520,H=430,cx=W/2,cy=90;
 const pos=f.map((_,i)=>{const a=n==1?Math.PI/2:Math.PI*(0.15+0.7*i/(n-1));return[cx+Math.cos(a)*(n>3?215:190),cy+Math.sin(a)*(n>3?290:270)]});
 const av=o=>by[o]&&by[o].ph?`img/npc/${o}_h.png`:'ui/i_res.png';
 return `<div class="net"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${pos.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#b9dde0" stroke-width="6" stroke-linecap="round"/>`).join('')}</svg>
 <div class="nd c" style="left:${cx/W*100}%;top:${cy/H*100}%"><img src="${av(x.id)}" alt=""><b>${x.ru.toUpperCase()}</b></div>
 ${f.map((r,i)=>`<div class="nd" style="left:${pos[i][0]/W*100}%;top:${pos[i][1]/H*100}%" onclick="location.hash='${r[0]}'"><img src="${av(r[0])}" alt=""><b>${r[1].toUpperCase()}</b></div>`).join('')}</div>`}
function perks(x){if(!x.perks.length)return '<p>Для этого жителя бонусов нет.</p>';
 return x.perks.map(([lv,n,t])=>{const love=lv>=10,k=love?8:Math.min(10,(lv-4)*2),a=love?'heart':'star';
 return `<div class="pk"><h4>${n}</h4><div class="sr">${Array.from({length:10},(_,i)=>`<img src="ui/i_${a}${i<k?'':'0'}.png" alt="">`).join('')}${love?'<span>+</span><img src="ui/i_ring.png" alt="">':''}</div><p>${t}</p></div>`}).join('')}
function show(){const x=cur,s=SEAS[x.s]||'',T=[['g','Подарки','t_g'],['s','Расписание','t_s'],['r','Связи','t_r'],['b','Бонусы','t_b']];
 const ph=x.pf?`<img class="${x.grp==3?'an':''}" src="img/npc/${x.id}_f.png" alt="">`:(x.ph?`<img class="sq" src="img/npc/${x.id}_h.png" alt="">`:'');
 const body={g:()=>gifts(x),s:()=>sched(x),r:()=>net(x),b:()=>`<h2>Бонусы отношений</h2>`+perks(x)}[tab]();
 $('#app').innerHTML=`<div class="card"><div class="deco back">${(DECO[dk(x)]||[]).filter(d=>d[2]=='b').map(dimg).join('')}</div><div class="paper"><div class="head"><div class="ph"><div class="in">${ph}</div><img class="tp a" src="ui/tape.png" alt=""><img class="tp b" src="ui/tape.png" alt=""></div><div><h1>${x.ru}</h1><div class="who">${x.who}</div><div class="bio">${x.bio}</div>
 <div class="meta"><div><img src="ui/i_${s||'cal'}.png" alt="">День рождения: ${x.s?String(x.s).padStart(2,'0')+'.'+String(x.d).padStart(2,'0'):'—'}</div>${x.grp==0?`<div><img src="ui/i_mar.png" alt="">Семейное положение: ${x.m}</div>`:''}${x.h?`<div><img src="ui/i_ht.png" alt="">Рост: ${x.h}</div>`:''}${x.w?`<div><img src="ui/i_wt.png" alt="">Вес: ${x.w}</div>`:''}</div></div></div>
 <div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';show()"><img src="ui/i_${t[2]}.png" alt="">${t[1]}</button>`).join('')}</div>
 <div class="panel">${tab=='s'?'<img class="tp c" src="ui/tape.png" alt=""><img class="tp d" src="ui/tape.png" alt="">':''}${body}</div></div><div class="deco">${(DECO[dk(x)]||[]).filter(d=>d[2]!='b').map(dimg).join('')}</div></div>`;snow(x.s==4)}
let grp=0;
function list(){snow(false);$('#app').innerHTML=`<div class="card"><div class="paper list"><h1>Жители Портии</h1><input id="q" placeholder="Поиск жителя…"><div class="chips" id="ch"></div><div class="grid" id="gr"></div></div></div>`;
 const f=()=>{const q=$('#q').value.toLowerCase();$('#ch').innerHTML=GR.map((g,i)=>`<button class="${grp==i&&!q?'on':''}" onclick="grp=${i};f()">${g} · ${D.filter(x=>x.grp==i).length}</button>`).join('');
  $('#gr').innerHTML=D.filter(x=>q?(x.ru+x.en).toLowerCase().includes(q):x.grp==grp).map(x=>`<a href="#${x.id}"><img src="${x.ph?`img/npc/${x.id}_h.png`:'ui/i_res.png'}" alt="">${x.ru}</a>`).join('')};window.f=f;$('#q').oninput=f;f()}
function dev(){if(!/dev/.test(location.search))return;const b=document.createElement('div');b.className='dev';const go=id=>{location.hash=id;route()};
