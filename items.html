<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Предметы — My Time at Portia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Philosopher:wght@700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--navy:#1d3f78;--ink:#4b3b28;--mut:#7d6a52;--br:#a85a2a;--f:'Nunito','Trebuchet MS',sans-serif;--h:'Philosopher','Georgia',serif}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.4 var(--f);color:var(--ink)}
main{flex:1;padding:44px 30px 90px;min-width:0}
.card{position:relative;width:min(840px,100%);margin:0 auto}
.paper{border:60px solid transparent;border-image:url(ui/paper-v.webp) 150 fill/60px stretch;padding:0 10px 22px;min-height:640px}
h1{font:700 44px/1.1 var(--h);color:var(--navy);margin:-8px 0 6px}.sub{color:var(--navy);font-weight:600;margin:0 0 16px}
.search{display:flex;align-items:center;gap:10px;background:#fff4d6;border:2px solid #e2b56a;border-radius:16px;padding:0 14px;height:50px;margin:0 0 18px}
.search svg{flex:none}.search input{flex:1;border:0;background:none;font:600 16px var(--f);color:#3b2f20;outline:none;min-width:0}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cc{position:relative;display:flex;gap:12px;padding:14px;min-height:150px;border-radius:20px;border:3px solid #cf8a4c;background:linear-gradient(#fff2cf,#fde6b4);box-shadow:inset 0 0 0 3px #fff6dc,0 4px 8px #6a3a1a44;text-decoration:none;color:var(--ink);transition:.15s}
.cc:hover{transform:translateY(-3px)}.cc>img{width:84px;height:84px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 3px #0003);align-self:center}
.cc .tx{flex:1;display:flex;flex-direction:column}.cc b{font:700 21px/1.15 var(--h);color:var(--navy)}.cc p{margin:6px 0;font-size:12.5px;line-height:1.3;color:#6b4a2b;flex:1}
.cc .ft{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#4a3820}.cc .go{width:26px;height:26px;border-radius:50%;background:#4a3a2a;color:#fff;display:grid;place-items:center;font-size:15px}
.back{display:inline-block;color:var(--navy);font-weight:800;text-decoration:none;margin:-4px 0 10px;font-size:14px}.back:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.chips button{border:0;border-radius:12px;padding:6px 12px;background:#f1d6a6;font:800 13px var(--f);color:var(--navy);cursor:pointer}.chips button.on{background:#fff;box-shadow:inset 0 0 0 2px #f0b968}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.ic{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px;border-radius:14px;background:linear-gradient(#fff6e0,#fbe6bd);border:2px solid #e7bf80;text-decoration:none;color:var(--navy);font-weight:800;font-size:12.5px;line-height:1.2;gap:4px}
.ic:hover{border-color:#cf8a4c}.ic img{width:56px;height:56px;object-fit:contain}.ic span{font-weight:700;font-size:11px;color:#7d5a2e;background:#f3d9a4;border-radius:8px;padding:1px 8px}
.more{display:block;margin:16px auto 0;border:0;border-radius:14px;padding:10px 22px;background:linear-gradient(#bfe6f5,#8cd0ea);color:var(--navy);font:800 14px var(--f);cursor:pointer}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.chip{flex:none;background:#6aa84f;color:#fff;font-weight:800;font-size:15px;padding:6px 18px;border-radius:14px;margin-top:10px;box-shadow:0 2px 3px #0003}
.en{font:italic 600 24px var(--h);color:#3b4a6b;margin:0 0 14px}
.hd{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start;margin-bottom:14px}
.big{display:grid;place-items:center;min-height:190px}.big img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 6px 6px #0004)}
.sec{margin:14px 0;border-radius:14px;background:rgba(255,243,214,.75);border:2px solid #ecc989;overflow:hidden;box-shadow:0 2px 4px #6a3a1a22}
.sec>h2{display:flex;align-items:center;gap:10px;margin:0;padding:8px 14px;background:linear-gradient(#f3d79c,#e8c07a);font:700 25px var(--h);color:#4a3418}.sec>h2 img{width:34px;height:34px;object-fit:contain}
.sec .bd{padding:10px 14px}.sr{display:flex;gap:12px;align-items:flex-start;padding:7px 0}.sr+.sr{border-top:1px solid #ecd5a6}.sr>img{width:44px;height:44px;object-fit:contain;flex:none}
.sr b{display:block;font:700 18px var(--h);color:var(--navy)}.sr p{margin:2px 0 0;font-size:14px;color:#4b3b28}.sr a{color:var(--navy);font-weight:800;text-decoration:none}.sr a:hover{text-decoration:underline}
.mats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.mt{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:12px;background:#fff8e6;border:1.5px solid #e2b56a;color:var(--navy);font-weight:800;font-size:13px;text-decoration:none}.mt img{width:28px;height:28px;object-fit:contain}.mt.tg{padding-left:10px;background:#e9f3d6;border-color:#b6d08a}
.ur{display:flex;align-items:center;gap:12px;padding:6px 0}.ur+.ur{border-top:1px solid #ecd5a6}.ur img{width:40px;height:40px;object-fit:contain}.ur b{font:700 17px var(--h);color:var(--navy)}.ur a{text-decoration:none}.ur a:hover b{text-decoration:underline}.ur p{margin:0;font-size:13.5px}
.tr{display:grid;grid-template-columns:1fr 1fr}.tr>div{padding:10px 14px;text-align:center}.tr>div+div{border-left:2px solid #ecd5a6}.tr small{display:block;color:#5a4528;font-weight:700}.tr .v{font:700 30px var(--h);color:#2f6b34;display:flex;gap:8px;align-items:center;justify-content:center;margin-top:2px}.tr .v.no{color:#5a4528;font-size:23px}
.gp{margin:0 0 6px;font-size:15px}.gl{margin:0;padding-left:22px}.gl li{margin:4px 0;font-size:15px;line-height:1.45}.gl a,.gp a{color:var(--navy);font-weight:800;text-decoration:none}.gl a:hover{text-decoration:underline}.inl{height:22px;width:22px;object-fit:contain;vertical-align:-6px}.gd{width:28px;height:28px;object-fit:contain}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f2b72b 55%,#b9770e);box-shadow:inset 0 0 0 2px #fff6c4,0 1px 2px #0005;display:inline-block}.v small{display:inline;font:700 16px var(--f);color:#6b4a2b}
.sh{font-size:14px;color:#4b3b28;margin-top:4px;text-align:left}.sh div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dotted #d9b97a}
.note{font-size:12.5px;color:#7d6a52}
@media(max-width:700px){main{padding:62px 4px 60px!important}.paper{border-width:34px;border-image-width:34px;padding:0 2px 16px;min-height:0}h1{font-size:32px}.cg{grid-template-columns:1fr}.cc>img{width:70px;height:70px}.hd{grid-template-columns:1fr}.big{min-height:130px}.big img{width:120px;height:120px}.en{font-size:19px}.chip{font-size:13px;padding:5px 12px}.ig{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.tr{grid-template-columns:1fr}.tr>div+div{border-left:0;border-top:2px solid #ecd5a6}.sec>h2{font-size:21px}}
</style><link rel="stylesheet" href="ui/side.css"></head>
<body class="side"><nav class="psb"><img class="logo" src="ui/logo.png" alt="My Time at Portia">
<a href="index.html"><img src="ui/i_home.png" alt="">Главная</a><a href="residents.html#list" id="nres"><img src="ui/i_res.png" alt="">Жители</a>
<a href="tracker-artifacts.html"><img src="ui/i_art.png" alt="">Трекер артефактов</a><a href="tracker-fish.html"><img src="ui/i_fish.png" alt="">Трекер рыб</a><a href="#" class="off"><img src="ui/i_calc.png" alt="">Калькулятор</a><a href="#" class="off"><img src="ui/i_rec.png" alt="">Рецепты</a><a href="items.html" class="on"><img src="ui/i_items.png" alt="">Предметы</a>
<div class="sp"></div><details class="sync" id="acct"><summary id="acctSum">☁ Проверяем вход…</summary><div class="accp">
    <div class="row" id="aFields" style="margin-top:10px" hidden><input type="email" id="aemail" placeholder="Почта" autocomplete="username"><input type="password" id="apass" placeholder="Пароль (от 6 символов)" autocomplete="current-password"></div>
    <div class="row" id="aBtns" hidden><button class="reset" id="alogin" style="margin:0">Войти</button><button class="reset" id="areg" style="margin:0">Создать аккаунт</button><button class="reset" id="areset" style="margin:0">Забыла пароль</button></div>
    <div class="row"><button class="reset" id="alogout" style="margin:0" hidden>Выйти</button></div>
    <p class="sub" id="aNote">Первый раз: введите почту и пароль и нажмите «Создать аккаунт». Один вход действует на всех страницах: прогресс трекеров подтягивается и сохраняется сам.</p>
  </div></details></nav>
<main><div class="card"><div class="paper" id="app"></div></div></main>
<script src="items.js"></script>
<script>
const $=s=>document.querySelector(s),by=Object.fromEntries(IT.map(x=>[x.i,x])),CK=Object.fromEntries(CATS.map(c=>[c[0],c])),ico=x=>x&&x.ic?`img/item/${x.ic}.webp`:'ui/i_items.png';
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const IC={mn:'item_pickaxe_1',tr:'item_axe',ch:'item_express03',dch:'item_equip_cardboardbox',hb:'item_basket',fi:'item_fishpole',mob:'item_marco_weapon_001',qu:'item_autumnmedalgold',rc:'item_accessories_processtoolbox',bx:'item_express03',cr:'item_accessories_processtoolbox',st:'item_accessories_processtoolbox',ck:'item_bread',shop:'item_goldbag',use:'item_book003',trade:'item_goldbag',desc:'item_book16'};
const si=k=>`<img src="img/item/${IC[k]}.webp" alt="" onerror="this.style.visibility='hidden'">`;
const gi=i=>by[i]||by[AL[i]],lk=i=>{const y=gi(i);return y?`<a href="#i/${y.i}">${esc(y.n)}</a>`:''};
const gold=n=>{const a=n%100,b=n%10;return a>10&&a<15?'гольдов':b==1?'гольд':b>1&&b<5?'гольда':'гольдов'},G=n=>n+' '+gold(n),hi=n=>`<img src="ui/s_${n}.png" alt="">`,inl=n=>`<img class="inl" src="ui/s_${n}.png" alt="">`;
const mt=(i,n)=>{const y=gi(i);return y?`<a class="mt" href="#i/${y.i}"><img src="${ico(y)}" alt="">${esc(y.n)}${n>1?' ×'+n:''}</a>`:''};
const card=x=>`<a class="ic" href="#i/${x.i}"><img src="${ico(x)}" alt="" loading="lazy"><div>${esc(x.n)}</div><span>${x.t}</span></a>`;
const MAG='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d3f78" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
let state={q:'',chip:'',n:90};
function srch(ph){return `<div class="search">${MAG}<input id="q" placeholder="${ph}" value="${esc(state.q)}" autocomplete="off"></div>`}
function catalog(){const cnt={};IT.forEach(x=>cnt[x.c]=(cnt[x.c]||0)+1);const plural=n=>{const a=n%100,b=n%10;return a>10&&a<15?'предметов':b==1?'предмет':b>1&&b<5?'предмета':'предметов'};
 $('#app').innerHTML=`<h1>Предметы</h1><p class="sub">Все предметы мира Портии, собранные в одном месте.</p>${srch('Поиск по предметам…')}<div id="res"></div>`;
 const draw=()=>{const q=state.q.trim().toLowerCase();if(q){const r=IT.filter(x=>(x.n+' '+x.e).toLowerCase().includes(q));$('#res').innerHTML=`<p class="note">Найдено: ${r.length}</p><div class="ig">${r.slice(0,state.n).map(card).join('')}</div>${r.length>state.n?'<button class="more" id="mo">Показать ещё</button>':''}`;const m=$('#mo');if(m)m.onclick=()=>{state.n+=90;draw()}}
  else $('#res').innerHTML='<div class="cg">'+CATS.map(c=>`<a class="cc" href="#c/${c[0]}"><img src="img/item/${c[3]}.webp" alt=""><div class="tx"><b>${c[1]}</b><p>${c[2]}</p><div class="ft"><span>${cnt[c[0]]||0} ${plural(cnt[c[0]]||0)}</span><span class="go">➜</span></div></div></a>`).join('')+'</div>'};
 $('#q').oninput=e=>{state.q=e.target.value;state.n=90;draw()};draw()}
function category(k){const c=CK[k];if(!c)return catalog();const all=IT.filter(x=>x.c==k),types=[...new Set(all.map(x=>x.t))];
 $('#app').innerHTML=`<a class="back" href="#">← Предметы</a><h1>${c[1]}</h1><p class="sub">${c[2]}</p>${srch('Поиск в категории…')}${types.length>1?'<div class="chips" id="ch"></div>':''}<div id="res"></div>`;
 const draw=()=>{const q=state.q.trim().toLowerCase();let r=all.filter(x=>(!state.chip||x.t==state.chip)&&(!q||(x.n+' '+x.e).toLowerCase().includes(q)));
  if($('#ch'))$('#ch').innerHTML=`<button class="${state.chip?'':'on'}" data-t="">Все · ${all.length}</button>`+types.map(t=>`<button class="${state.chip==t?'on':''}" data-t="${t}">${t} · ${all.filter(x=>x.t==t).length}</button>`).join('');
  $('#res').innerHTML=`<div class="ig">${r.slice(0,state.n).map(card).join('')}</div>${r.length>state.n?'<button class="more" id="mo">Показать ещё ('+(r.length-state.n)+')</button>':''}`;const m=$('#mo');if(m)m.onclick=()=>{state.n+=120;draw()}};
 $('#q').oninput=e=>{state.q=e.target.value;state.n=90;draw()};if($('#ch'))$('#ch').onclick=e=>{if(e.target.dataset.t!==undefined){state.chip=e.target.dataset.t;state.n=90;draw()}};draw()}
function sources(x){const L=[],ln=a=>a.map(lk).filter(Boolean).join(', '),ml=a=>a.map(m=>{const y=gi(m[0]);return y?`<a href="#i/${y.i}">${esc(y.n)}</a>${m[1]>1?' ×'+m[1]:''}`:''}).filter(Boolean).join(', ');
 x.s.forEach(e=>{const k=e[0];
  if(k=='mn')L.push('Добыть киркой, разбивая камни и рудные жилы');
  else if(k=='tr')L.push('Срубить дерево или выкорчевать пень');
  else if(k=='ch')L.push('Найти в сундуках в городе и окрестностях');
  else if(k=='dch')L.push('Найти в сундуках в подземельях');
  else if(k=='hb')L.push('Собрать в дикой природе');
  else if(k=='fi')L.push('Выловить удочкой');
  else if(k=='mob')L.push('Выбить из монстров: '+e[1].map(esc).join(', '));
  else if(k=='tl')L.push('Получить в награду за прохождение: '+e[1].map(esc).join(', '));
  else if(k=='or')L.push('Получить в награду за выполнение заказов');
  else if(k=='jr')L.push('Разбить кувшины, бочки и ящики');
  else if(k=='pi')L.push('Разбить предметы, расставленные в мире');
  else if(k=='qu')L.push('Получить в награду за выполнение заданий');
  else if(k=='rc')L.push('Получить при переработке: '+ln(e[1]));
  else if(k=='bx')L.push('Достать из: '+ln(e[1]));
  else if(k=='ck')L.push('Приготовить на кухне по рецепту, указанному выше');
  else if(k=='cr')L.push('Изготовить '+inl('fab')+' из: '+ml(e[3])+(e[2]?` (стоимость работы — ${G(e[2])})`:''));
  else if(k=='st'){const lv=Math.min(3,Math.max(1,e[3]||1));L.push(`Собрать на ${inl('wb'+lv)} верстаке ${lv} ур. из компонентов: `+ml(e[2]))}});
 if(x.sh.length)L.push('Купить в магазинах: '+x.sh.map(s=>esc(s[0])+' ('+(s[1]?G(s[1]):'обмен')+')').join(', '));
 if(!L.length)return '<p class="note">Способы получения пока не описаны.</p>';
 return `<p class="gp">${esc(x.n)} можно получить ${L.length>1?'следующими способами':'так'}:</p><ul class="gl">${L.map((t,i)=>`<li>${t}${i<L.length-1?';':'.'}</li>`).join('')}</ul>`}
function recipes(x){const R=x.s.filter(e=>e[0]=='ck');if(!R.length)return '';
 return `<div class="sec"><h2>${hi('use')}Рецепт приготовления</h2><div class="bd">${R.map((e,i)=>`<div class="sr"><div><b>${R.length>1?'Вариант '+(i+1):'Ингредиенты'}</b><div class="mats">${e[1].map(m=>m[0]=='i'?mt(m[1],m[2]):`<span class="mt tg">Любые: ${esc(m[1])}${m[2]>1?' ×'+m[2]:''}</span>`).join('')}</div></div></div>`).join('')}</div></div>`}
function item(id){const x=gi(id);if(!x)return catalog();if(x.i!=id)history.replaceState(null,'','#i/'+x.i);const c=CK[x.c];
 const uses=[...new Set(x.u.map(u=>{const y=gi(u);return y?y.i:null}).filter(Boolean))],ushow=uses.slice(0,40).map(u=>`<div class="ur"><img src="${ico(by[u])}" alt=""><a href="#i/${u}"><b>${esc(by[u].n)}</b></a><p>${by[u].c=='food'?'Используется в рецепте.':'Используется при изготовлении.'}</p></div>`).join('');
 const sale=x.sl?`<div class="v"><img class="gd" src="ui/s_gold.png" alt="">${x.p} <small>${gold(x.p)}</small></div>`:'<div class="v no">Нельзя продать</div>';
 const buy=x.sh.length?`<div class="sh">${x.sh.map(s=>`<div><span>${esc(s[0])}</span><b>${s[1]?G(s[1]):'обмен'}</b></div>`).join('')}</div>`:'<div class="v no">Не продаётся</div><small>В магазинах</small>';
 const set=x.st?IT.filter(y=>y.st==x.st&&y.i!=x.i):[];
 $('#app').innerHTML=`<a class="back" href="#c/${x.c}">← ${c[1]}</a><div class="top"><h1>${esc(x.n)}</h1><span class="chip">${x.t}</span></div>${x.e&&x.e!=x.n&&!x.n.startsWith('Чертёж')?`<div class="en">${esc(x.e)}</div>`:''}
 <div class="hd"><div class="big"><img src="${ico(x)}" alt=""></div><div class="sec" style="margin:0"><h2>${hi('desc')}Описание</h2><div class="bd">${x.d?esc(x.d):'Описания нет.'}${x.ef?'<p class="note">'+esc(x.ef)+'</p>':''}${x.fv>0?`<p class="note">Питательность: ${x.fv}</p>`:''}${x.nv>1?`<p class="note">Вариантов предмета: ${x.nv} (отличаются окраской или качеством).</p>`:''}</div></div></div>
 ${recipes(x)}
 <div class="sec"><h2>${hi('get')}Получение</h2><div class="bd">${sources(x)}</div></div>
 ${set.length?`<div class="sec"><h2>${hi('use')}Комплект «${esc(x.st)}»</h2><div class="bd">${set.map(y=>`<div class="ur"><img src="${ico(y)}" alt=""><a href="#i/${y.i}"><b>${esc(y.n)}</b></a><p>${esc(y.sp||y.t)}</p></div>`).join('')}</div></div>`:''}
 ${ushow?`<div class="sec"><h2>${hi('use')}Где применяется</h2><div class="bd">${ushow}${uses.length>40?`<p class="note">…и ещё ${uses.length-40}</p>`:''}</div></div>`:''}
 <div class="sec"><h2>${hi('trade')}Торговля</h2><div class="tr"><div><small>Цена продажи</small>${sale}</div><div><small>Цена покупки</small>${buy}</div></div></div>`;
 document.title=x.n+' — My Time at Portia'}
function route(){const h=location.hash.slice(1),[a,b]=h.split('/');state={q:'',chip:'',n:90};scrollTo(0,0);document.title='Предметы — My Time at Portia';if(a=='i')item(b);else if(a=='c')category(b);else catalog()}
addEventListener('hashchange',route);route();
</script><script src="ui/auth.js"></script><script src="ui/mobile.js"></script></body></html>
